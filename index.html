<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI Music Video</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#09090b;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:24px;
}

h1{
  margin:0 0 8px;
  font-size:32px;
}

.sub{
  color:#999;
  margin-bottom:24px;
}

.badge{
  display:inline-block;
  background:#18181b;
  border:1px solid #333;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card{
  background:#111113;
  border:1px solid #29292d;
  border-radius:16px;
  padding:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 8px;
}

input[type=file],
textarea,
select{
  width:100%;
  background:#18181b;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  padding:12px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.chip{
  background:#18181b;
  color:#aaa;
  border:1px solid #333;
  padding:9px 14px;
  border-radius:9px;
  cursor:pointer;
}

.chip.active{
  background:#fff;
  color:#000;
}

.check{
  display:flex;
  gap:9px;
  align-items:center;
  margin:14px 0;
}

.check input{
  width:18px;
  height:18px;
}

.generate{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.generate:disabled{
  opacity:.5;
}

.screen{
  min-height:500px;
  background:#050505;
  border:1px solid #29292d;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.screen video,
.screen img{
  max-width:100%;
  max-height:600px;
}

.info{
  white-space:pre-line;
  color:#999;
  font-size:13px;
  margin-top:8px;
}

.status{
  margin-top:15px;
  color:#aaa;
}

.bar{
  height:7px;
  background:#222;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  width:0%;
  background:#fff;
  transition:.3s;
}

.result{
  margin-top:15px;
  padding:14px;
  background:#18181b;
  border-radius:10px;
  display:none;
}

.result a{
  color:#fff;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>AI Music Video</h1>

<div class="sub">
Create music videos with AI lip-sync.
</div>

<div class="badge">
VIDEO + LIP-SYNC +
